# Product Owner / Product Manager profile.
#
# Only the fields that differ from the built-in defaults are listed. Anything
# omitted here (timezone, hybrid_markers, eor_signals, ...) is inherited.
# See engineering.yml for the full annotated field list.
#
# Webhook: set DISCORD_WEBHOOK_PRODUCT_OWNER in the environment.

name: product-owner

# Curated Canadian / B2B-SaaS / health-tech boards. Every slug here is copied
# from engineering.yml, where it was verified to return 200 with a non-empty
# job array, so the platform filing is already correct (e.g. getmaple is Lever
# and d2l is Greenhouse — the Lever copies of both are different companies).
#
# These carry the search: the free aggregators skew US-remote, which is exactly
# the population the Canada-eligibility problem lives in.
boards:
    ashby:
        # Canadian employers
        - wealthsimple
        - jobber
        - benevity
        - thinkific
        - cohere
        - koho
        - neofinancial
        - float
        - clearco
        - loopio
        - miovision
        - lightspeedhq
        - hopper
        - trulioo
        - docebo
        # Health tech
        - felix
        - jane
        - headway
        # B2B SaaS with real product orgs
        - clickup
        - dovetail
        - notion
        - miro
        - 1password
        - amplitude # Ashby, not Greenhouse — verified live (37 postings)
    greenhouse:
        # Canadian employers
        - hootsuite
        - later
        - pagerduty
        - tailscale
        - flipp
        - shakepay
        - d2l
        - staffbase
        # Health tech
        - leagueinc
        - alayacare
        - oscar
        # Enterprise / workflow SaaS
        - asana
        - smartsheet
        - intercom
        - coursera
    lever:
        # Canadian employers
        - wattpad
        - eqbank
        - waveapps
        - achievers
        - telesat
        - kepler
        # Health tech
        - pointclickcare
        - getmaple
        - lyrahealth
        - ro

# ATS fetchers must be listed here or the boards above are never polled --
# collect_matches iterates `sources`, not `boards`. The two aggregators stay
# on; both require attribution, which the alert footer provides automatically.
sources:
    - ashby
    - greenhouse
    - lever
    - remoteok
    - himalayas

min_salary:
    CAD: 125000
    USD: 100000

primary_role_keywords:
    - technical product owner
    - technical product manager
    - platform product manager
    - healthcare product manager
    - digital health product manager
    - product manager
secondary_role_keywords:
    - product owner
    - platform product owner
    - ai product manager
    - growth product manager

# "B2B SaaS Product Manager" and similar rarely appear verbatim in titles, so
# a bare "product" title is accepted when the description carries the signal.
# Matched on word boundaries, so this no longer fires on "Productivity".
generic_title_fallbacks:
    - product
require_in_description:
    - product strategy
    - roadmap
    - backlog
    - discovery
    - prioritization
    - user research
    - product requirements
    - stakeholder

# Two DISTINCT signals, not one. A recruiter, counsel or security posting that
# supports a product team mentions "roadmap" or "stakeholder" in passing; an
# actual product posting also names discovery, backlog or prioritization.
require_in_description_min: 2

# Word-boundary matched, so "lead" will not match "leadership". Deliberately
# excludes no form of "technical", "platform" or "developer" — all three
# appear in wanted titles ("Product Manager, Developer Platform").
exclude_title_exact:
    - junior
    - associate
    - intern
    - director
    - vp
    # "\bvp\b" cannot match "SVP" -- s and v are both word characters, so
    # there is no boundary between them. Needs its own entry.
    - svp
    - cpo
    - chief product officer
    - vice president
    - head of product
    - commission
    - software engineer
    - devops
    # Adjacent "product" roles the generic-title fallback would otherwise let
    # through from the broad aggregator feeds.
    - designer
    - design
    - marketing
    - sales
    - support
    # Seniority band. The search is for Product Owner / Product Manager only,
    # so everything above that band is excluded here rather than scored.
    #
    # PHRASE-LEVEL ON PURPOSE. A bare "senior" matches "Product Manager,
    # Senior Living Solutions" -- senior care is the core product vocabulary
    # at PointClickCare and AlayaCare, both on the board list above. Bare
    # "staff" would take "Staff Scheduling" and bare "group" would take
    # "Group Benefits" the same way.
    #
    # The comma variants are not redundant: "\bsenior product\b" cannot match
    # "Senior, Product Management", the same gap that made "svp" need its own
    # entry above.
    - senior product
    - senior, product
    - senior technical product
    - senior pm
    - principal product
    - principal, product
    - principal pm
    - staff product
    - staff pm
    - group product manager
    - lead product
    - product lead
    # Safe bare, unlike "senior" and "staff": no product or health-tech noun
    # contains it, and it also closes a long-standing leak -- "Principal
    # Engineer, Product Engineering" reaches the generic `product` fallback
    # and would otherwise be carded as a product role.
    - principal
    # Safe bare for a different reason: "sr" is always followed by a period
    # or a space, both word boundaries. A phrase form would be worse here --
    # "sr product" cannot match "Sr. Product Manager".
    - sr

# Unreachable now that the seniority band is excluded by title: every posting
# that survives the filter lacks all three markers, so this scores 0 for all
# of them. Kept only to document why `level` is weighted 0 below.
high_level_keywords:
    - senior
    - lead
    - principal

# Bucket weights, summing to 100. Salary is deliberately 0: BELOW_THRESHOLD
# already rejects a posting outright, so the only thing a salary score still
# expressed was whether the employer chose to publish a range -- which says
# nothing about role fit and cost every unlisted posting 15 points.
#
# `level` is 0 for a different reason: the band filter means every surviving
# posting scores identically on it, and a bucket with the same value for every
# candidate cannot rank anything. Its 20 points are redistributed in
# proportion to the remaining buckets rather than left to cap the channel at
# 80. The figures below are also chosen so `_scale_to_weight` truncates
# nothing: role 40 over raw_max 15 and location 20 over raw_max 100 are both
# exact on every reachable raw value, and signal 35 over raw_max 35 is the
# identity (it was lossy at 30).
#
# signal = domain (premium_signals) + product skills (good_signals).
score_weights:
    role: 40
    level: 0
    signal: 35
    location: 20
    tools: 5
    salary: 0

# Domain / product-environment signals. 7 points each within the signal
# bucket, capped before scaling.
premium_signals:
    - enterprise saas
    - b2b saas
    - healthcare technology
    - digital health
    - product strategy
    - roadmap ownership
    - discovery
    - backlog prioritization
    - workflow automation
    - platform modernization
    - integrations
    - data quality
    - ai-enabled

# Product capabilities. 3 points each. These are the transferable
# responsibilities that make a PM posting readable as a fit regardless of the
# title on it -- the PO -> PM question is decided here, not by title matching.
good_signals:
    - customer discovery
    - user research
    - stakeholder management
    - cross-functional
    - roadmap
    - prioritization
    - agile
    - scrum
    - customer feedback
    - adoption
    - analytics
    - modernization
    - apis

# Tooling: a nudge, never a filter. Isolated in its own 5-point bucket so it
# cannot crowd out domain signals the way it did while sharing the 35-point
# signal cap -- five tool mentions used to be worth more than two domain ones.
tool_signals:
    - Jira
    - Confluence
    - Azure DevOps
    - Pendo
    - Figma
    - SQL
    - AWS
    - AWS Bedrock
    - GitHub
    - GenAI
    - LLM

key_signal_terms:
    - product strategy
    - roadmap
    - discovery
    - backlog
    - integrations
    - workflow automation
    - analytics
    - Jira
    - Confluence
    - Pendo
    - SQL
    - APIs
key_signal_fallback: Product Strategy / Delivery

# Remote preferred, hybrid acceptable; onsite and unstated are rejected.
work_modes:
    - remote
    - hybrid

# Matched against the location string and the first 500 characters of the
# description. Golden Horseshoe + Waterloo region named explicitly, because a
# posting that says "Burlington, ON" never says "Ontario".
#
# The GTA municipalities below are not duplication of `commutable_regions`:
# without them a REMOTE role advertised from Markham or Brampton fails this
# filter outright, because "Markham, ON" contains no region term and no
# wildcard either.
regions:
    - canada
    - canadian
    - ontario
    - toronto
    - gta
    - greater toronto
    - oakville
    - burlington
    - mississauga
    - hamilton
    - kitchener
    - waterloo
    - ottawa
    - brampton
    - markham
    - vaughan
    - richmond hill
    - north york
    - etobicoke
    - scarborough
    - milton
    - pickering
    - ajax
    - whitby
    - oshawa

# Geographies that rule the candidate out. Scored, never filtered, and read
# from the TITLE and LOCATION only -- country names appear in EEO boilerplate
# and office lists throughout a description, so a full-text scan would flag
# nearly everything.
#
# "u.s." is absent on purpose: re.escape makes it `u\.s\.` and a trailing \b
# needs an adjacent word character, so it never matches at end of string.
# Bare "us" is also unsafe -- it fires on "join us".
region_exclusions:
    - usa
    - united states
    - us only
    - us-based
    - us based
    - uk
    - united kingdom
    - emea
    - latam
    - apac
    - india
    - australia
    - philippines
    - bulgaria
    - germany
    - poland
    - spain
    - brazil
    - mexico
    - singapore
    # US metros, which is how these feeds usually write a US-only remote role
    # ("New York - Remote", "Remote (USA - Boston, MA)"). Spelled out in full:
    # two-letter codes are unusable here, since "CA" is both California and
    # Canada. "London" is absent for the same class of reason -- London,
    # Ontario. A tier-1 allowance still overrides any of these.
    - new york
    - nyc
    - san francisco
    - bay area
    - boston
    - chicago
    - austin
    - seattle
    - denver
    - atlanta
    - los angeles
    - washington dc
    - miami

# --------------------------------------------------------------------------
# Canada eligibility. Unlike region_exclusions above, these DO filter -- but
# only the `excluded` verdict drops a posting. `unclear` passes and is flagged
# on the card, because silence is the overwhelmingly common case on these
# feeds and dropping it would leave the channel empty.
# --------------------------------------------------------------------------

# Tier 1: names Canada as workable. Beats every blocker below -- an employer
# that says it can hire here has answered the only question being asked, and
# it does not matter where the job itself is.
region_allowances:
    - remote in canada
    - remote within canada
    - anywhere in canada
    - canada remote
    - canadian remote
    - open to candidates in canada
    - hire in canada
    - hiring in canada
    - entity in canada
    # Bare "north america" is deliberately absent. It is a market, not a
    # hiring claim -- sales postings say it constantly -- and as a tier-1
    # allowance it badged "New York - Remote" and "Spain - Remote" as
    # Canada-eligible. Only the explicit forms qualify.
    - anywhere in north america
    - remote in north america
    - across north america

# Tier 2: global-sounding, but silent on Canada specifically. These PASS and
# report `unclear`, never `eligible`. "Work from anywhere" routinely means
# "anywhere we already run payroll", and treating it as a promise would
# repeat exactly the mistake of reading a bare "Remote" as Canada-eligible.
region_global_claims:
    - work from anywhere
    - fully remote globally
    - globally remote
    - hire anywhere in the world
    - work from any location
    - anywhere in the world

# Complete phrases only. Bare "us" fires on "join us", and "u.s." can never
# match at all -- re.escape makes it `u\.s\.` and a trailing \b needs a
# following word character.
region_blockers:
    - must reside in the united states
    - must be located in the united states
    - must be based in the united states
    - residing in the united states
    - united states only
    - us-based only
    - this role is us-based
    - usa only
    - uk only
    - must be a uk resident

# Residency stems, each read together with the ~60 characters that follow it.
# The stem alone decides nothing: "must reside in Canada" and "must reside in
# the United States" are the same phrase up to the place name. A window
# naming an accepted region wins outright, so a posting listing several
# countries passes as long as Canada is one of them; a window naming nowhere
# recognisable is left unclear rather than treated as disqualifying.
#
# Every stem must constrain the CANDIDATE. A bare "based in" is excluded for
# exactly this reason: "a company based in the United States" describes the
# employer's head office and says nothing about where it can hire, so using
# it would drop the US-headquartered firms that staff Toronto offices.
residency_markers:
    - must reside in
    - must live in
    - must be located in
    - must be based in
    - must be a resident of
    - must be physically located in
    - candidates must be located in
    - required to reside in
    - this role is based in
    - authorized to work in

# EOR is irrelevant for a Canada-based search against Canadian employers.
require_eor: false

# Commute reach. Applies ONLY to postings detected as hybrid or onsite, so a
# fully remote role in Vancouver or Ottawa is unaffected -- which is why this
# is a separate list from `regions` rather than a narrowing of it.
commutable_regions:
    - toronto
    - gta
    - greater toronto
    - mississauga
    - brampton
    - markham
    - vaughan
    - richmond hill
    - north york
    - etobicoke
    - scarborough
    - oakville
    - burlington
    - milton
    - pickering
    - ajax
    - whitby
    - oshawa

# Hybrid is acceptable up to three days in the office. A posting that states
# no cadence is kept: this can only act on what the description actually says.
# Open-ended wording ("3+ days", "at least 3 days") counts as four, since it
# promises no upper bound at all.
max_office_days_per_week: 3

# Rescaled with the weights above. The old 35 was set against a reachable
# ceiling of 80; zeroing `level` and redistributing its 20 points lifts that
# ceiling to 100, so the same relative bar is 35/80 * 100 ~= 44. Leaving it at
# 35 would card nearly everything.
#
# Worked example at the new weights: a plain "Product Manager" in Toronto
# with three premium signals scores role 40 + signal 21 + location 20 = 81.
alert_threshold: 45

outreach_note_template: >-
    Hi [Name], saw the {title} opening at {company} and wanted to connect
    regarding product strategy, discovery and delivery.
