# Product Owner / Product Manager profile.
#
# Only the fields that differ from the built-in defaults are listed. Anything
# omitted here (timezone, hybrid_markers, eor_signals, ...) is inherited.
# See engineering.yml for the full annotated field list.
#
# Webhook: set DISCORD_WEBHOOK_PRODUCT_OWNER in the environment.

name: product-owner

# Curated Canadian / B2B-SaaS / health-tech boards. Every slug here is copied
# from engineering.yml, where it was verified to return 200 with a non-empty
# job array, so the platform filing is already correct (e.g. getmaple is Lever
# and d2l is Greenhouse — the Lever copies of both are different companies).
#
# These carry the search: the free aggregators skew US-remote, which is exactly
# the population the Canada-eligibility problem lives in.
boards:
    ashby:
        # Canadian employers
        - wealthsimple
        - jobber
        - benevity
        - thinkific
        - cohere
        - koho
        - neofinancial
        - float
        - clearco
        - loopio
        - miovision
        - lightspeedhq
        - hopper
        - trulioo
        - docebo
        # Health tech
        - felix
        - jane
        - headway
        # B2B SaaS with real product orgs
        - clickup
        - dovetail
        - notion
        - miro
        - 1password
        - amplitude # Ashby, not Greenhouse — verified live (37 postings)
    greenhouse:
        # Canadian employers
        - hootsuite
        - later
        - pagerduty
        - tailscale
        - flipp
        - shakepay
        - d2l
        - staffbase
        # Health tech
        - leagueinc
        - alayacare
        - oscar
        # Enterprise / workflow SaaS
        - asana
        - smartsheet
        - intercom
        - coursera
    lever:
        # Canadian employers
        - wattpad
        - eqbank
        - waveapps
        - achievers
        - telesat
        - kepler
        # Health tech
        - pointclickcare
        - getmaple
        - lyrahealth
        - ro

# ATS fetchers must be listed here or the boards above are never polled --
# collect_matches iterates `sources`, not `boards`. The two aggregators stay
# on; both require attribution, which the alert footer provides automatically.
sources:
    - ashby
    - greenhouse
    - lever
    - remoteok
    - himalayas

min_salary:
    CAD: 125000
    USD: 100000

primary_role_keywords:
    - senior product owner
    - senior technical product owner
    - technical product owner
    - senior product manager
    - technical product manager
    - platform product manager
    - healthcare product manager
    - digital health product manager
    - product manager
secondary_role_keywords:
    - product owner
    - platform product owner
    - lead product owner
    - product lead
    - ai product manager
    - growth product manager

# "B2B SaaS Product Manager" and similar rarely appear verbatim in titles, so
# a bare "product" title is accepted when the description carries the signal.
# Matched on word boundaries, so this no longer fires on "Productivity".
generic_title_fallbacks:
    - product
require_in_description:
    - product strategy
    - roadmap
    - backlog
    - discovery
    - prioritization
    - user research
    - product requirements
    - stakeholder

# Two DISTINCT signals, not one. A recruiter, counsel or security posting that
# supports a product team mentions "roadmap" or "stakeholder" in passing; an
# actual product posting also names discovery, backlog or prioritization.
require_in_description_min: 2

# Word-boundary matched, so "lead" will not match "leadership". Deliberately
# excludes no form of "technical", "platform" or "developer" — all three
# appear in wanted titles ("Product Manager, Developer Platform").
exclude_title_exact:
    - junior
    - associate
    - intern
    - director
    - vp
    # "\bvp\b" cannot match "SVP" -- s and v are both word characters, so
    # there is no boundary between them. Needs its own entry.
    - svp
    - cpo
    - chief product officer
    - vice president
    - head of product
    - commission
    - software engineer
    - devops
    # Adjacent "product" roles the generic-title fallback would otherwise let
    # through from the broad aggregator feeds.
    - designer
    - design
    - marketing
    - sales
    - support

# Director/VP are omitted here because they are excluded above.
high_level_keywords:
    - senior
    - lead
    - principal

premium_signals:
    - enterprise saas
    - b2b saas
    - healthcare technology
    - digital health
    - product strategy
    - roadmap ownership
    - discovery
    - backlog prioritization
    - workflow automation
    - platform modernization
    - integrations
    - data quality
    - ai-enabled

# Tools are scored but never required.
good_signals:
    - Jira
    - Confluence
    - Azure DevOps
    - Pendo
    - Figma
    - SQL
    - AWS
    - AWS Bedrock
    - GitHub
    - APIs

key_signal_terms:
    - product strategy
    - roadmap
    - discovery
    - backlog
    - integrations
    - workflow automation
    - analytics
    - Jira
    - Confluence
    - Pendo
    - SQL
    - APIs
key_signal_fallback: Product Strategy / Delivery

# Remote preferred, hybrid acceptable; onsite and unstated are rejected.
work_modes:
    - remote
    - hybrid

# Matched against the location string and the first 500 characters of the
# description. Golden Horseshoe + Waterloo region named explicitly, because a
# posting that says "Burlington, ON" never says "Ontario".
regions:
    - canada
    - canadian
    - ontario
    - toronto
    - gta
    - oakville
    - burlington
    - mississauga
    - hamilton
    - kitchener
    - waterloo
    - ottawa

# EOR is irrelevant for a Canada-based search against Canadian employers.
require_eor: false

# Lowered from 50. A plain "Product Manager" title scores 0 for level (no
# senior/lead/principal keyword) and 5 for an unlisted salary, so its ceiling
# is role 15 + salary 5 + signal 35 = 55. At 50 it needed a near-perfect
# signal sweep just to get a card. 35 clears it on ~3 premium signals.
alert_threshold: 35

outreach_note_template: >-
    Hi [Name], saw the {title} opening at {company} and wanted to connect
    regarding product strategy, discovery and delivery.
