name: Daily Remote Job Tracker

on:
    schedule:
        # Runs 4x daily at 03:00, 09:00, 15:00, 21:00 UTC (every 6 hours)
        - cron: "0 3,9,15,21 * * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    run-tracker:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        strategy:
            # Profiles are isolated in the database by their `profile` column,
            # so one profile's seen_jobs can't suppress another's. Keep
            # fail-fast off so a broken profile doesn't cancel the others.
            fail-fast: false
            matrix:
                include:
                    - profile: profiles/engineering.yml
                      webhook_secret: DISCORD_WEBHOOK_ENGINEERING
                    - profile: profiles/product-owner.yml
                      webhook_secret: DISCORD_WEBHOOK_PRODUCT_OWNER

        steps:
            - name: Check out Repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install Dependencies
              run: pip install -r requirements.txt

            - name: Execute Tracker Script
              env:
                  # Falls back to the shared webhook when a per-profile one
                  # isn't configured yet.
                  DISCORD_WEBHOOK_URL: ${{ secrets[matrix.webhook_secret] || secrets.DISCORD_WEBHOOK_URL }}
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
              run: python track_jobs.py --profile ${{ matrix.profile }}
